plugins { id "com.android.application" }
android {
    namespace "mx.djmili.app"
    compileSdk 34
    defaultConfig {
        applicationId "mx.djmili.app"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger() + 130)
        versionName "1.3"
    }
    signingConfigs {
        release {
            // La clave vive en un secreto del repo (KEYSTORE_B64); el workflow la escribe aquí y nunca se sube al repo.
            def ks = file("release.p12")
            if (ks.exists()) {
                storeFile ks
                storeType "pkcs12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "djmili"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // No comprimir audio/medios: se leen directo del APK
    androidResources { noCompress += ["mp3", "flac", "wav", "m4a"] }
}
dependencies {
    implementation "androidx.webkit:webkit:1.12.1"
}
