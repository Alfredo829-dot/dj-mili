name: APK Android
on:
  push:
    branches: [main]
    paths-ignore: ["shots/**", "tests/**", "README.md"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Copiar la app web dentro del APK (funciona sin internet)
        run: |
          set -e
          W=android/app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W"
          cp -r index.html manifest.webmanifest css js assets icons "$W"/
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties
          du -sh "$W"
      - name: Clave de firma (secreto del repo; misma clave en cada versión para poder actualizar)
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          test -n "$KEYSTORE_B64" || { echo "Falta el secreto KEYSTORE_B64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.p12
      - name: Compilar APK firmado
        working-directory: android
        env: { KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}" }
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verificar (apksigner + aapt)
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" dj-mili.apk
          rm -f android/app/release.p12
          "$BT/apksigner" verify --verbose --print-certs dj-mili.apk | grep -Ev "^WARNING" | tee verify.txt
          "$BT/aapt" dump badging dj-mili.apk | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:|launchable)" | tee badging.txt
          "$BT/aapt" list dj-mili.apk | grep -c "assets/www/" | sed 's/^/archivos web en el APK: /' | tee -a badging.txt
          ls -l dj-mili.apk
      - name: Publicar Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          set -e
          TAG="apk-v1.3-r${GITHUB_RUN_NUMBER}"
          { echo "DJ Mili para Android (v1.3, compilación ${GITHUB_RUN_NUMBER}, commit ${GITHUB_SHA::7})."; echo; echo "Instalar: descarga dj-mili.apk en el teléfono, ábrelo y permite 'instalar apps desconocidas'. Firmado con una clave de sideload propia (no Play Store); las siguientes versiones se instalan encima sin perder tu música."; echo; echo '```'; cat verify.txt badging.txt; echo '```'; } > notes.md
          gh release create "$TAG" dj-mili.apk --title "DJ Mili APK v1.3 (r${GITHUB_RUN_NUMBER})" --notes-file notes.md --latest
      - uses: actions/upload-artifact@v4
        with: { name: dj-mili-apk, path: dj-mili.apk }
